<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoiLink Logo Exporter (PNG & SVG)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0B0F19;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFFFFF, #94A3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94A3B8;
      font-size: 16px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 28px;
      width: 100%;
      max-width: 1100px;
    }
    .card {
      background: #131B2E;
      border: 1px solid #1E293B;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge-tag {
      font-size: 11px;
      background: #007AFF22;
      color: #007AFF;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid #007AFF44;
    }
    .preview-box {
      width: 100%;
      height: 160px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #33415544;
    }
    .preview-light {
      background: #FFFFFF;
    }
    .preview-dark {
      background: #090D16;
    }
    .preview-checkered {
      background-color: #0f172a;
      background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                        linear-gradient(-45deg, transparent 75%, #1e293b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
    }
    button {
      flex: 1;
      min-width: 140px;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-primary {
      background: #007AFF;
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background: #0062CC;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #FFFFFF;
      transform: translateY(-1px);
    }
    svg.icon-inline {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Логотипы SoiLink в формате PNG</h1>
    <p>Скачайте любую версию в высоком разрешении на прозрачном фоне в один клик</p>
  </div>

  <div class="cards-grid">
    <!-- Card 1: Horizontal Full Logo (Dark Text) -->
    <div class="card">
      <div class="card-title">
        <span>Горизонтальный логотип (Темный)</span>
        <span class="badge-tag">Основной</span>
      </div>
      <div class="preview-box preview-light">
        <canvas id="canvas-logo-dark" width="420" height="120" style="width: 280px; height: 80px;"></canvas>
      </div>
      <div class="btn-group">
        <button class="btn-primary" onclick="downloadLogo('canvas-logo-dark', 'soilink-logo-2x.png', 2, 'dark')">
          Скачать PNG (2x HD)
        </button>
        <button class="btn-secondary" onclick="downloadLogo('canvas-logo-dark', 'soilink-logo-4k.png', 4, 'dark')">
          PNG 4K (4x)
        </button>
      </div>
    </div>

    <!-- Card 2: Horizontal Full Logo (White Text for Dark Theme) -->
    <div class="card">
      <div class="card-title">
        <span>Горизонтальный логотип (Белый)</span>
        <span class="badge-tag">Для темного фона</span>
      </div>
      <div class="preview-box preview-dark">
        <canvas id="canvas-logo-white" width="420" height="120" style="width: 280px; height: 80px;"></canvas>
      </div>
      <div class="btn-group">
        <button class="btn-primary" onclick="downloadLogo('canvas-logo-white', 'soilink-logo-white-2x.png', 2, 'white')">
          Скачать PNG (2x HD)
        </button>
        <button class="btn-secondary" onclick="downloadLogo('canvas-logo-white', 'soilink-logo-white-4k.png', 4, 'white')">
          PNG 4K (4x)
        </button>
      </div>
    </div>

    <!-- Card 3: Blue Leaf Icon / App Badge Only -->
    <div class="card">
      <div class="card-title">
        <span>Иконка / Знак (Синий листик)</span>
        <span class="badge-tag">Квадрат</span>
      </div>
      <div class="preview-box preview-checkered">
        <canvas id="canvas-icon" width="256" height="256" style="width: 100px; height: 100px;"></canvas>
      </div>
      <div class="btn-group">
        <button class="btn-primary" onclick="downloadBadge('soilink-icon-512.png', 512)">
          Скачать PNG 512×512
        </button>
        <button class="btn-secondary" onclick="downloadBadge('soilink-icon-1024.png', 1024)">
          PNG 1024×1024
        </button>
      </div>
    </div>
  </div>

  <script>
    // Helper to draw the rounded rectangle with leaf
    function drawLeafBadge(ctx, x, y, size) {
      const rx = size * 0.28;
      
      // Rounded rect
      ctx.save();
      ctx.fillStyle = '#007AFF';
      ctx.beginPath();
      ctx.roundRect(x, y, size, size, rx);
      ctx.fill();

      // Leaf strokes
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = size * 0.07;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Leaf contour
      ctx.beginPath();
      const p1x = x + size * 0.33, p1y = y + size * 0.67;
      const cp1x = x + size * 0.29, cp1y = y + size * 0.49;
      const cp2x = x + size * 0.37, cp2y = y + size * 0.33;
      const tipX = x + size * 0.67, tipY = y + size * 0.33;
      const cp3x = x + size * 0.67, cp3y = y + size * 0.63;
      const cp4x = x + size * 0.51, cp4y = y + size * 0.71;

      ctx.moveTo(p1x, p1y);
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, tipX, tipY);
      ctx.bezierCurveTo(cp3x, cp3y, cp4x, cp4y, p1x, p1y);
      ctx.stroke();

      // Leaf central vein / stem
      ctx.beginPath();
      ctx.moveTo(x + size * 0.27, y + size * 0.73);
      ctx.bezierCurveTo(x + size * 0.33, y + size * 0.67, x + size * 0.45, y + size * 0.55, tipX, tipY);
      ctx.stroke();
      ctx.restore();
    }

    // Render horizontal logo
    function renderHorizontalLogo(canvasId, textColor, scale = 1) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const badgeSize = 80 * scale;
      const badgeX = 16 * scale;
      const badgeY = (canvas.height - badgeSize) / 2;

      drawLeafBadge(ctx, badgeX, badgeY, badgeSize);

      ctx.font = `700 ${54 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.fillStyle = textColor;
      ctx.letterSpacing = `${-1.5 * scale}px`;
      ctx.textBaseline = 'middle';
      ctx.fillText('SoiLink', badgeX + badgeSize + 22 * scale, canvas.height / 2);
    }

    // Initial previews
    renderHorizontalLogo('canvas-logo-dark', '#111827');
    renderHorizontalLogo('canvas-logo-white', '#FFFFFF');

    // Preview badge
    const iconCanvas = document.getElementById('canvas-icon');
    const iconCtx = iconCanvas.getContext('2d');
    drawLeafBadge(iconCtx, 16, 16, 224);

    // Download handlers
    function downloadLogo(sourceId, filename, scale, theme) {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 420 * scale;
      exportCanvas.height = 120 * scale;
      const ctx = exportCanvas.getContext('2d');

      const textColor = theme === 'white' ? '#FFFFFF' : '#111827';
      const badgeSize = 80 * scale;
      const badgeX = 16 * scale;
      const badgeY = (exportCanvas.height - badgeSize) / 2;

      drawLeafBadge(ctx, badgeX, badgeY, badgeSize);

      ctx.font = `700 ${54 * scale}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.fillStyle = textColor;
      ctx.letterSpacing = `${-1.5 * scale}px`;
      ctx.textBaseline = 'middle';
      ctx.fillText('SoiLink', badgeX + badgeSize + 22 * scale, exportCanvas.height / 2);

      const link = document.createElement('a');
      link.download = filename;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    }

    function downloadBadge(filename, size) {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = size;
      exportCanvas.height = size;
      const ctx = exportCanvas.getContext('2d');
      const padding = size * 0.04;
      const badgeSize = size - padding * 2;

      drawLeafBadge(ctx, padding, padding, badgeSize);

      const link = document.createElement('a');
      link.download = filename;
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
